version: '3'

vars:
  FOO: bar
  
tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  server-start:
    desc: Run local dev server with the blog
    env:
      HOST_IP:
        sh: ipconfig getifaddr en1
    cmds:
      - docker compose up --no-log-prefix --no-color --force-recreate --build
      - defer:
          task: server-stop
  
  server-stop:
    desc: Stop local dev server with blog
    cmds:
      - docker compose down

  server-logs:
    desc: Show logs of local dev server with the blog
    cmds:
      - docker compose logs --no-log-prefix --no-color

  # ── blog (Hugo) ──────────────────────────────────────────────
  blog-serve:
    desc: Local dev server for the blog (alias of server-start)
    cmds:
      - task: server-start

  blog-build:
    desc: Production build of the blog into dist/ (Docker, CI-parity)
    cmds:
      - docker compose run --user $(id -u):$(id -g) --rm hugo-runtime --environment production --destination dist --gc --minify

  # ── slides (Vite/reveal.js) — wired after `git subtree` in Phase 2 ──
  slides-build:
    desc: "Build decks into dist/slides/ — pending slides subtree (Phase 2)"
    cmds:
      - 'echo "slides/ arrives via git subtree in Phase 2"; exit 1'

  # ── keepup (Python/uv) ───────────────────────────────────────
  keepup-build:
    desc: Generate the weekly digest (renders keepup/dist/)
    dir: keepup
    cmds:
      - uv run python -m keepup

  keepup-publish:
    desc: Render the digest and publish it to R2 (mirrors the weekly workflow)
    dir: keepup
    cmds:
      - task: keepup-build
      - npx wrangler r2 object put devdosvid-keepup/keepup/index.html --file=dist/index.html --content-type=text/html --remote
      - for f in dist/archive/*.html; do npx wrangler r2 object put "devdosvid-keepup/keepup/archive/$(basename "$f")" --file="$f" --content-type=text/html --remote; done

  # ── combined site ────────────────────────────────────────────
  build:
    desc: Assemble the static site (blog + slides) into dist/
    cmds:
      - rm -rf dist
      - task: blog-build
      # slides-build appends dist/slides/ once slides are in the repo

  deploy:
    desc: Build dist/ and deploy the Worker (preview on *.workers.dev until the route is enabled)
    cmds:
      - task: build
      - npx wrangler deploy